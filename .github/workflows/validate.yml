name: Validate portfolio
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - name: Render social preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-dejavu-core
          rsvg-convert public/og-keyvisual.svg -o public/og-keyvisual.png
      - run: npm run build
      - run: test -s out/og-keyvisual.png
