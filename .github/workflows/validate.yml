name: Validate portfolio
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - name: Render social preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil
          /usr/bin/python3 -c "from PIL import Image; im=Image.open('public/og-keyvisual-dark-final.webp'); assert im.size == (1200,630); im.convert('RGB').save('public/og-keyvisual.png', optimize=True)"
      - run: npm run build
      - run: test -s out/og-keyvisual.png && test -s out/og-keyvisual-dark-final.webp
